name: 💡 Feature request
description: Suggest an idea or improvement for PawsMC
labels: [enhancement]
type: 'feature'

body:
  - type: checkboxes
    attributes:
      label: Please confirm the following.
      options:
        - label: I checked the [existing issues](https://github.com/Pawciolszef/PawsMC/issues) for duplicate feature requests
          required: true
  - type: textarea
    attributes:
      label: Describe the feature or improvement
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem it solves
      description: Is your suggested feature related to a problem? Ex. I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or mockups about the suggested feature here.
    validations:
      required: false
