name: 🐛 Bug report
description: Report a bug or unexpected behavior in PawsMC
labels: [bug]
type: 'bug'
body:
  - type: checkboxes
    attributes:
      label: Please confirm the following.
      options:
        - label: I checked the [existing issues](https://github.com/Pawciolszef/PawsMC/issues) for duplicate problems
          required: true
        - label: I have ensured my PawsMC installation is up to date
          required: true
  - type: input
    id: version
    attributes:
      label: What version of PawsMC are you using?
      description: Find this in ⚙️ Settings (bottom left)
      placeholder: 'e.g. 1.2.0'
    validations:
      required: true
  - type: dropdown
    id: oses
    attributes:
      label: What operating system are you on?
      options:
        - Windows
        - Linux
        - MacOS
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. Include screenshots if applicable.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context & Logs
      description: Add launcher logs or any other context about the problem here.
    validations:
      required: false
