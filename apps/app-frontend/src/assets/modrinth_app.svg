<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="paws-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="paws-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="paws-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="128" height="128" rx="28" fill="url(#paws-grad-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Glowing Paw Silhouette -->
  <g filter="url(#paws-glow)">
    <!-- Main Pad -->
    <path d="M 64 62 C 48 62 42 76 44 88 C 46 98 54 104 64 104 C 74 104 82 98 84 88 C 86 76 80 62 64 62 Z" fill="url(#paws-grad-primary)" />
    <!-- Top-Left Toe -->
    <ellipse cx="38" cy="46" rx="9" ry="13" transform="rotate(-18 38 46)" fill="url(#paws-grad-primary)" />
    <!-- Top-Center-Left Toe -->
    <ellipse cx="55" cy="38" rx="9.5" ry="14" transform="rotate(-6 55 38)" fill="url(#paws-grad-primary)" />
    <!-- Top-Center-Right Toe -->
    <ellipse cx="73" cy="38" rx="9.5" ry="14" transform="rotate(6 73 38)" fill="url(#paws-grad-primary)" />
    <!-- Top-Right Toe -->
    <ellipse cx="90" cy="46" rx="9" ry="13" transform="rotate(18 90 46)" fill="url(#paws-grad-primary)" />
  </g>
</svg>
